[project]
name = "llama-python-wrapper"
version = "0.1.0"
description = "High-performance llama-server pipeline and drop-in llama_cpp replacement with auto-concurrency"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.0.0",
    "jupyter>=1.0.0",
]
